<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二苓國小 114學年度寶可夢課表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif;
            background-color: #f0f4f8;
            background-image: 
                radial-gradient(#ffcb05 0.5px, transparent 0.5px),
                radial-gradient(#ffcb05 0.5px, #f0f4f8 0.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        :root {
            --poke-red: #ee1515;
            --poke-white: #ffffff;
            --poke-black: #222222;
            --poke-yellow: #ffcb05;
            --poke-blue: #2a75bb;
        }

        /* 屬性配色系統 */
        .type-none { background-color: #f1f5f9 !important; color: #94a3b8 !important; }
        .type-國語 { background-color: #ff4422 !important; color: white !important; }
        .type-英語 { background-color: #3399ff !important; color: white !important; }
        .type-數學 { background-color: #ffcc33 !important; color: #443300 !important; }
        .type-生活 { background-color: #77cc55 !important; color: white !important; }
        .type-自然 { background-color: #7ac852 !important; color: white !important; }
        .type-社會 { background-color: #b8a038 !important; color: white !important; }
        .type-藝術 { background-color: #ee99ee !important; color: white !important; }
        .type-綜合 { background-color: #a8a878 !important; color: white !important; }
        .type-健康 { background-color: #ffb7d5 !important; color: #a04070 !important; }
        .type-體育 { background-color: #ff8000 !important; color: white !important; }
        .type-彈性 { background-color: #a890f0 !important; color: white !important; }
        .type-本土語 { background-color: #e0c068 !important; color: white !important; }
        .type-資訊 { background-color: #b8b8d0 !important; color: #334144 !important; }
        .type-音樂 { background-color: #6890f0 !important; color: white !important; }
        .type-藝表 { background-color: #f85888 !important; color: white !important; }
        .type-藝美 { background-color: #705898 !important; color: white !important; }
        /* 自定義課程專用色 */
        .type-custom { background-color: #b0875e !important; color: white !important; border: 2px solid #8c6a4a !important; }

        .game-card {
            border: 4px solid var(--poke-black);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
        }

        .poke-header {
            background: linear-gradient(180deg, var(--poke-red) 48%, var(--poke-black) 48%, var(--poke-black) 52%, var(--poke-white) 52%);
            border-bottom: 4px solid var(--poke-black);
        }

        .pokeball-center {
            width: 40px; height: 40px;
            background: white;
            border: 5px solid var(--poke-black);
            border-radius: 50%;
            position: relative;
        }

        .pokeball-center::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            background: white;
            border: 2px solid var(--poke-black);
            border-radius: 50%;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            text-align-last: center;
            outline: none;
        }

        .merged-cell-container {
            border: 2px solid var(--poke-black);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 老師名字標籤樣式 - 預設隱藏，有課時才顯示 */
        .trainer-label {
            position: absolute;
            right: 1px;
            bottom: 1px;
            font-size: 9px;
            line-height: 1;
            padding: 2px 4px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            opacity: 0; /* 預設隱藏 */
            display: none; /* 預設不佔位 */
            pointer-events: auto;
            white-space: nowrap;
            z-index: 10;
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        /* 當課程被選取時呈現的樣式 */
        .has-course .trainer-label {
            opacity: 1;
            display: block;
        }

        .trainer-label:focus {
            background: #fff;
            box-shadow: 0 0 0 2px var(--poke-blue);
            outline: none;
            color: #000;
        }

        .editable-field:focus {
            outline: none;
            background-color: #fffbeb;
            box-shadow: 0 0 0 3px #fbbf24;
            border-radius: 4px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .game-card { border-width: 2px; box-shadow: none; }
            .poke-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="p-2 md:p-6 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- 頂部標題區 -->
        <div class="game-card rounded-3xl overflow-hidden bg-white mb-4">
            <header class="poke-header p-4 flex flex-col items-center">
                <div class="pokeball-center mb-3 animate-bounce"></div>
                <h1 id="main-title" contenteditable="true" class="editable-field text-lg sm:text-2xl md:text-4xl font-black text-slate-800 bg-white/95 px-6 py-2 rounded-full border-4 border-slate-800 shadow-sm text-center mb-4">
                    二苓國小 114 學年度課表
                </h1>

                <!-- 訓練家管理 -->
                <div class="no-print flex items-center gap-2 bg-white/90 p-2 rounded-xl border-2 border-slate-800">
                    <span class="font-bold text-xs">當前訓練家:</span>
                    <select id="user-selector" onchange="handleUserSwitch()" class="bg-blue-50 border border-slate-400 rounded px-2 py-1 font-bold text-xs cursor-pointer">
                    </select>
                    <button onclick="addNewTrainer()" class="bg-green-500 text-white px-2 py-1 rounded text-xs font-bold hover:bg-green-600 transition-colors">＋新增</button>
                </div>
            </header>
        </div>

        <!-- 課表本體 -->
        <div class="game-card rounded-2xl bg-white overflow-hidden mb-4 shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse table-fixed min-w-[320px]">
                    <thead>
                        <tr class="bg-blue-600 text-white text-[10px] sm:text-sm">
                            <th class="p-1 border-r-4 border-b-4 border-slate-800 w-[60px] sm:w-[75px] bg-blue-700 font-bold italic text-center text-xs">節次</th>
                            <th class="p-1 border-b-4 border-slate-800 font-black text-center">週一</th>
                            <th class="p-1 border-b-4 border-slate-800 font-black text-center">週二</th>
                            <th class="p-1 border-b-4 border-slate-800 font-black text-center">週三</th>
                            <th class="p-1 border-b-4 border-slate-800 font-black text-center">週四</th>
                            <th class="p-1 border-b-4 border-slate-800 font-black text-center">週五</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body">
                        <!-- 由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 功能按鈕區 -->
        <div class="grid grid-cols-3 gap-2 no-print pb-6">
            <button onclick="window.print()" class="flex flex-col items-center justify-center bg-amber-400 border-b-4 border-amber-700 p-2 rounded-xl font-bold text-[10px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>🖨️</span><span>列印課表</span>
            </button>
            <button onclick="exportData()" class="flex flex-col items-center justify-center bg-blue-500 text-white border-b-4 border-blue-800 p-2 rounded-xl font-bold text-[10px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>📤</span><span>匯出備份</span>
            </button>
            <button onclick="importData()" class="flex flex-col items-center justify-center bg-purple-500 text-white border-b-4 border-purple-800 p-2 rounded-xl font-bold text-[10px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>📥</span><span>匯入檔案</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 no-print pb-10">
            <button onclick="clearCurrentData()" class="bg-slate-200 text-slate-600 p-2 rounded-xl text-[10px] font-bold">清空當前課表</button>
            <button onclick="deleteTrainer()" class="bg-rose-100 text-rose-600 p-2 rounded-xl text-[10px] font-bold">刪除此訓練家</button>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-xl transition-all duration-300 z-50 font-bold text-sm text-center min-w-[200px]">
        提示訊息
    </div>

    <script>
        // 科目與配色名單
        const KNOWN_COURSES = ["國語", "英語", "數學", "生活", "社會", "自然", "藝術", "綜合", "健康", "體育", "彈性", "本土語", "資訊", "音樂", "藝表", "藝美"];
        const COURSES = ["", ...KNOWN_COURSES, "自定義"];
        
        const CLASSES = [""];
        [1, 2, 3, 4, 5, 6].forEach(grade => {
            const count = (grade === 4 || grade === 6) ? 4 : 3;
            for (let i = 1; i <= count; i++) { CLASSES.push(`${grade}-${i}`); }
        });
        CLASSES.push("自定義");

        const DEFAULT_PERIODS = [
            { name: "晨光", time: "08:00~08:25" },
            { name: "第一節", time: "08:30~09:10" },
            { name: "第二節", time: "09:20~10:00" },
            { name: "第三節", time: "10:30~11:10" },
            { name: "第四節", time: "11:20~12:00" },
            { name: "午休", time: "12:00~13:35" },
            { name: "第五節", time: "13:40~14:20" },
            { name: "第六節", time: "14:30~15:10" },
            { name: "第七節", time: "15:20~16:00" }
        ];

        let appData = JSON.parse(localStorage.getItem('erling_poke_data')) || {
            trainers: ["李宜昆"],
            currentTrainer: "李宜昆",
            schedules: {} 
        };

        window.onload = () => {
            // 強制每次進入都顯示李宜昆
            if (appData.trainers.includes("李宜昆")) {
                appData.currentTrainer = "李宜昆";
            }
            
            renderTimetableSkeleton();
            updateTrainerListUI();
            loadCurrentTrainerData();
        };

        // 渲染基礎表格
        function renderTimetableSkeleton() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';
            DEFAULT_PERIODS.forEach((p, idx) => {
                const tr = document.createElement('tr');
                const tdTime = document.createElement('td');
                tdTime.className = "p-0.5 border-r-4 border-b-2 border-slate-800 bg-slate-50 text-center w-[60px] sm:w-[75px]";
                tdTime.innerHTML = `
                    <div id="tn-${idx}" contenteditable="true" class="editable-field font-bold text-slate-800 text-[10px] sm:text-xs" onblur="saveToLocal()">${p.name}</div>
                    <div id="tr-${idx}" contenteditable="true" class="editable-field text-[8px] sm:text-[9px] text-slate-500 font-bold leading-tight whitespace-nowrap" onblur="saveToLocal()">${p.time}</div>
                `;
                tr.appendChild(tdTime);

                for (let d = 1; d <= 5; d++) {
                    const td = document.createElement('td');
                    td.className = "p-1 border-b-2 border-r-2 border-slate-200 text-center";
                    const container = document.createElement('div');
                    container.id = `cell-box-${idx}-${d}`;
                    container.className = "merged-cell-container rounded-lg shadow-sm h-11 md:h-14 transition-all";

                    const selCourse = document.createElement('select');
                    selCourse.id = `course-${idx}-${d}`;
                    selCourse.className = "w-full h-2/3 bg-transparent cursor-pointer font-black text-[10px] sm:text-sm border-b border-black/10 flex items-center justify-center";
                    COURSES.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.text = c || "---"; selCourse.appendChild(opt);
                    });
                    selCourse.onchange = (e) => handleSelectChange(selCourse, e.target.value, 'course', idx, d);

                    const selClass = document.createElement('select');
                    selClass.id = `class-${idx}-${d}`;
                    selClass.className = "w-full h-1/3 bg-white/50 cursor-pointer font-bold text-[8px] sm:text-[10px] text-slate-600 flex items-center justify-center";
                    CLASSES.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.text = c || "班級"; selClass.appendChild(opt);
                    });
                    selClass.onchange = (e) => handleSelectChange(selClass, e.target.value, 'class', idx, d);

                    // 新增可編輯的老師名字標籤
                    const trainerLabel = document.createElement('div');
                    trainerLabel.id = `label-${idx}-${d}`;
                    trainerLabel.className = "trainer-label";
                    trainerLabel.contentEditable = "true";
                    trainerLabel.innerText = appData.currentTrainer;
                    trainerLabel.onblur = () => saveToLocal();

                    container.appendChild(selCourse);
                    container.appendChild(selClass);
                    container.appendChild(trainerLabel);
                    td.appendChild(container);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });

            document.getElementById('main-title').onblur = () => saveToLocal();
        }

        function handleSelectChange(select, value, type, idx, d) {
            if (value === "自定義") {
                const custom = prompt("請輸入名稱：");
                if (custom) {
                    if (!Array.from(select.options).some(o => o.value === custom)) {
                        const opt = document.createElement('option');
                        opt.value = custom; opt.text = custom; select.add(opt);
                    }
                    select.value = custom;
                } else { select.value = ""; }
            }
            if (type === 'course') applyTypeStyle(select, idx, d);
            saveToLocal();
        }

        // 顏色套用與標籤顯示邏輯
        function applyTypeStyle(select, idx, d) {
            const val = select.value;
            const container = document.getElementById(`cell-box-${idx}-${d}`);
            if (!container) return;

            // 清除現有所有 type 相關 class
            container.classList.forEach(className => {
                if (className.startsWith('type-')) { container.classList.remove(className); }
            });
            container.style.backgroundColor = "";

            if (!val) {
                container.classList.add('type-none');
                container.classList.remove('has-course'); // 隱藏標籤
                select.style.color = "#94a3b8";
                return;
            }

            // 標記為已有課程，顯示老師標籤
            container.classList.add('has-course');

            if (KNOWN_COURSES.includes(val)) {
                container.classList.add(`type-${val}`);
                select.style.color = "inherit";
            } else {
                container.classList.add('type-custom');
                select.style.color = "white";
            }
        }

        function saveToLocal() {
            const trainer = appData.currentTrainer;
            if (!appData.schedules[trainer]) appData.schedules[trainer] = { course: {}, class: {}, time: {}, labels: {}, title: "" };

            appData.schedules[trainer].title = document.getElementById('main-title').innerText;
            
            // 儲存課程與班級
            document.querySelectorAll('select[id^="course"]').forEach(s => appData.schedules[trainer].course[s.id] = s.value);
            document.querySelectorAll('select[id^="class"]').forEach(s => appData.schedules[trainer].class[s.id] = s.value);
            
            // 儲存可編輯的老師標籤
            document.querySelectorAll('.trainer-label').forEach(l => appData.schedules[trainer].labels[l.id] = l.innerText);
            
            // 儲存節次時間
            const timeData = {};
            DEFAULT_PERIODS.forEach((_, idx) => {
                const tn = document.getElementById(`tn-${idx}`);
                const tr = document.getElementById(`tr-${idx}`);
                if (tn) timeData[`tn-${idx}`] = tn.innerText;
                if (tr) timeData[`tr-${idx}`] = tr.innerText;
            });
            appData.schedules[trainer].time = timeData;

            localStorage.setItem('erling_poke_data', JSON.stringify(appData));
            showToast("自動儲存中");
        }

        function loadCurrentTrainerData() {
            const trainer = appData.currentTrainer;
            const data = appData.schedules[trainer];
            
            document.getElementById('main-title').innerText = (data && data.title) ? data.title : "二苓國小 114 學年度課表";

            resetTableUI(); 

            if (!data) {
                // 如果沒有資料，標籤預設為當前訓練家名字
                document.querySelectorAll('.trainer-label').forEach(label => {
                    label.innerText = trainer;
                });
                return;
            }

            // 載入課程
            if (data.course) {
                Object.entries(data.course).forEach(([id, val]) => {
                    const sel = document.getElementById(id);
                    if (sel && val) {
                        if (!Array.from(sel.options).some(o => o.value === val)) {
                            const o = document.createElement('option'); o.value = val; o.text = val; sel.add(o);
                        }
                        sel.value = val;
                        const parts = id.split('-');
                        applyTypeStyle(sel, parts[1], parts[2]);
                    }
                });
            }
            // 載入班級
            if (data.class) {
                Object.entries(data.class).forEach(([id, val]) => {
                    const sel = document.getElementById(id);
                    if (sel && val) {
                        if (!Array.from(sel.options).some(o => o.value === val)) {
                            const o = document.createElement('option'); o.value = val; o.text = val; sel.add(o);
                        }
                        sel.value = val;
                    }
                });
            }
            // 載入老師標籤
            if (data.labels) {
                Object.entries(data.labels).forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = val;
                });
            } else {
                document.querySelectorAll('.trainer-label').forEach(label => {
                    label.innerText = trainer;
                });
            }
            // 載入時間
            if (data.time) {
                Object.entries(data.time).forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = val;
                });
            }
        }

        function updateTrainerListUI() {
            const sel = document.getElementById('user-selector');
            sel.innerHTML = '';
            appData.trainers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.text = t; sel.appendChild(opt);
            });
            sel.value = appData.currentTrainer;
        }

        function handleUserSwitch() {
            appData.currentTrainer = document.getElementById('user-selector').value;
            loadCurrentTrainerData();
            showToast(`切換至: ${appData.currentTrainer}`);
        }

        function addNewTrainer() {
            const name = prompt("發現新訓練家！請輸入名字：");
            if (name && !appData.trainers.includes(name)) {
                appData.trainers.push(name);
                appData.currentTrainer = name;
                updateTrainerListUI();
                loadCurrentTrainerData();
                saveToLocal();
            } else if (name) {
                alert("該名字已在名冊中！");
            }
        }

        function resetTableUI() {
            document.querySelectorAll('select').forEach(s => {
                s.value = "";
                if (s.id.includes('course')) {
                    const parts = s.id.split('-');
                    applyTypeStyle(s, parts[1], parts[2]);
                }
            });
            DEFAULT_PERIODS.forEach((p, idx) => {
                const tn = document.getElementById(`tn-${idx}`);
                const tr = document.getElementById(`tr-${idx}`);
                if (tn) tn.innerText = p.name;
                if (tr) tr.innerText = p.time;
            });
            // 重置標籤顯示狀態
            document.querySelectorAll('.merged-cell-container').forEach(c => {
                c.classList.remove('has-course');
            });
        }

        function clearCurrentData() {
            if (confirm("確定要重設當前這位訓練家的課表嗎？")) {
                resetTableUI();
                saveToLocal();
            }
        }

        function deleteTrainer() {
            if (appData.trainers.length <= 1) return;
            if (confirm(`確定要刪除「${appData.currentTrainer}」嗎？`)) {
                delete appData.schedules[appData.currentTrainer];
                appData.trainers = appData.trainers.filter(t => t !== appData.currentTrainer);
                appData.currentTrainer = "李宜昆"; 
                updateTrainerListUI();
                loadCurrentTrainerData();
                localStorage.setItem('erling_poke_data', JSON.stringify(appData));
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `二苓國小課表備份_${new Date().toLocaleDateString()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        const content = JSON.parse(readerEvent.target.result);
                        if (content.trainers) {
                            appData = content;
                            localStorage.setItem('erling_poke_data', JSON.stringify(appData));
                            location.reload();
                        }
                    } catch (err) { alert("讀取失敗，請確認檔案格式是否正確"); }
                }
            }
            input.click();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1000);
        }
    </script>
</body>
</html>
