<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二苓國小 114學年度寶可夢課表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif;
            background-color: #f0f4f8;
            background-image: 
                radial-gradient(#ffcb05 0.5px, transparent 0.5px),
                radial-gradient(#ffcb05 0.5px, #f0f4f8 0.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        :root {
            --poke-red: #ee1515;
            --poke-white: #ffffff;
            --poke-black: #222222;
            --poke-yellow: #ffcb05;
            --poke-blue: #2a75bb;
        }

        /* 屬性配色系統 */
        .type-none { background-color: #f1f5f9 !important; color: #94a3b8 !important; }
        .type-國語 { background-color: #ff4422 !important; color: white !important; }
        .type-英語 { background-color: #3399ff !important; color: white !important; }
        .type-數學 { background-color: #ffcc33 !important; color: #443300 !important; }
        .type-生活 { background-color: #77cc55 !important; color: white !important; }
        .type-自然 { background-color: #7ac852 !important; color: white !important; }
        .type-社會 { background-color: #b8a038 !important; color: white !important; }
        .type-藝術 { background-color: #ee99ee !important; color: white !important; }
        .type-綜合 { background-color: #a8a878 !important; color: white !important; }
        .type-健康 { background-color: #ffb7d5 !important; color: #a04070 !important; }
        .type-體育 { background-color: #ff8000 !important; color: white !important; }
        .type-彈性 { background-color: #a890f0 !important; color: white !important; }
        .type-本土語 { background-color: #e0c068 !important; color: white !important; }
        .type-資訊 { background-color: #b8b8d0 !important; color: #334144 !important; }
        .type-音樂 { background-color: #6890f0 !important; color: white !important; }
        .type-藝表 { background-color: #f85888 !important; color: white !important; }
        .type-藝美 { background-color: #705898 !important; color: white !important; }
        .type-custom { background-color: #b0875e !important; color: white !important; border: 1.5px solid #8c6a4a !important; }

        .game-card {
            border: 4px solid var(--poke-black);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
        }

        .poke-header {
            background: linear-gradient(180deg, var(--poke-red) 48%, var(--poke-black) 48%, var(--poke-black) 52%, var(--poke-white) 52%);
            border-bottom: 4px solid var(--poke-black);
        }

        .pokeball-center {
            width: 40px; height: 40px;
            background: white;
            border: 5px solid var(--poke-black);
            border-radius: 50%;
            position: relative;
        }

        .pokeball-center::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            background: white;
            border: 2px solid var(--poke-black);
            border-radius: 50%;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            text-align: center;
            text-align-last: center; 
        }

        .merged-cell-container {
            border: 1.5px solid var(--poke-black);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .prefix-select {
            width: 50%; 
            background: transparent;
            font-size: 9px;
            font-weight: bold;
            color: inherit;
            border: none;
            text-align: right;
            text-align-last: right; 
            padding-right: 1px;
        }

        .course-select-custom {
            width: 50%; 
            background: transparent;
            font-size: 9px;
            font-weight: black;
            color: inherit;
            border: none;
            text-align: left;
            text-align-last: left; 
            padding-left: 1px;
        }

        .teacher-select-custom {
            height: 33.33%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-weight: bold;
            font-size: 8.5px;
            color: #333;
            text-align: center;
            text-align-last: center; 
            border: none;
            width: 100%;
        }

        /* 班級模式輸入框樣式 */
        .class-mode-input {
            border-bottom: 2px solid var(--poke-blue);
            background: transparent;
            font-weight: bold;
            text-align: center;
            outline: none;
            width: 80px;
        }

        @media (min-width: 640px) {
            .teacher-select-custom { font-size: 10px; }
            .prefix-select, .course-select-custom { font-size: 11px; }
            .class-mode-input { width: 120px; }
        }

        .editable-field:focus {
            outline: none;
            background-color: #fffbeb;
            box-shadow: 0 0 0 3px #fbbf24;
            border-radius: 4px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .game-card { border-width: 2px; box-shadow: none; }
            .poke-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="p-1 md:p-6 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- 頂部管理區 -->
        <div class="game-card rounded-2xl md:rounded-3xl overflow-hidden bg-white mb-3 shadow-sm">
            <header class="poke-header p-2 md:p-4 flex flex-col items-center">
                <div class="pokeball-center mb-2 animate-bounce"></div>
                <h1 id="main-title" contenteditable="true" class="editable-field text-base sm:text-2xl md:text-4xl font-black text-slate-800 bg-white/95 px-4 md:px-6 py-1.5 rounded-full border-2 md:border-4 border-slate-800 shadow-sm text-center mb-3 whitespace-nowrap overflow-hidden">
                    二苓國小 114 學年度課表
                </h1>

                <!-- 模式管理容器 -->
                <div class="no-print flex flex-col gap-2 items-center w-full px-2">
                    <!-- 第一行：訓練家選單 (寬度與第二行一致) -->
                    <div class="flex flex-wrap justify-center items-center gap-1.5 md:gap-2 bg-white/90 p-1.5 md:p-2 rounded-xl border-2 border-slate-800 shadow-inner w-full max-w-[340px] sm:max-w-[500px]">
                        <span class="font-bold text-[9px] md:text-xs">當前訓練家:</span>
                        <select id="user-selector" onchange="handleUserSwitch()" class="bg-blue-50 border border-slate-400 rounded px-1 md:px-2 py-0.5 font-bold text-[9px] md:text-xs cursor-pointer min-w-[70px] sm:min-w-[100px]">
                        </select>
                        <button onclick="addNewTrainer()" class="bg-green-500 text-white px-1.5 py-0.5 rounded text-[9px] md:text-xs font-bold hover:bg-green-600 transition-colors">＋新增</button>
                        <button id="btn-default" onclick="setDefaultTrainer()" class="bg-amber-400 text-slate-900 px-1.5 py-0.5 rounded text-[9px] md:text-xs font-bold hover:bg-amber-500 transition-colors">⭐ 設為預設</button>
                    </div>

                    <!-- 第二行：班級課表模式設定 (寬度與第一行一致) -->
                    <div class="flex flex-wrap justify-center items-center gap-1.5 md:gap-3 bg-white/90 p-1.5 md:p-2 rounded-xl border-2 border-slate-800 shadow-inner w-full max-w-[340px] sm:max-w-[500px]">
                        <div class="flex items-center gap-1">
                            <span class="font-bold text-[9px] md:text-xs text-slate-700">班級課表:</span>
                            <select id="class-mode-selector" onchange="handleClassModeChange()" class="bg-blue-50 border border-slate-400 rounded px-1 py-0.5 font-bold text-[9px] md:text-xs cursor-pointer min-w-[80px]">
                                <!-- 動態生成 -->
                            </select>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="font-bold text-[9px] md:text-xs text-slate-700">導師名字:</span>
                            <input type="text" id="class-tutor-input" placeholder="輸入姓名" onblur="saveToLocal()" class="class-mode-input text-[9px] md:text-xs px-1 text-blue-800">
                        </div>
                    </div>
                </div>
            </header>
        </div>

        <!-- 課表表格 -->
        <div class="game-card rounded-xl bg-white overflow-hidden mb-3 shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse table-fixed min-w-[300px]">
                    <thead>
                        <tr class="bg-blue-600 text-white text-[9px] sm:text-sm">
                            <th class="p-1 border-r-2 md:border-r-4 border-b-2 md:border-b-4 border-slate-800 w-[55px] sm:w-[75px] bg-blue-700 font-bold italic text-center">節次</th>
                            <th class="p-0.5 border-b-2 md:border-b-4 border-slate-800 font-black text-center">週一</th>
                            <th class="p-0.5 border-b-2 md:border-b-4 border-slate-800 font-black text-center">週二</th>
                            <th class="p-0.5 border-b-2 md:border-b-4 border-slate-800 font-black text-center">週三</th>
                            <th class="p-0.5 border-b-2 md:border-b-4 border-slate-800 font-black text-center">週四</th>
                            <th class="p-0.5 border-b-2 md:border-b-4 border-slate-800 font-black text-center">週五</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 功能按鈕 -->
        <div class="grid grid-cols-3 gap-1 md:gap-2 no-print pb-4">
            <button onclick="window.print()" class="flex flex-col items-center justify-center bg-amber-400 border-b-4 border-amber-700 p-1.5 rounded-xl font-bold text-[9px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>🖨️</span><span class="whitespace-nowrap">列印課表</span>
            </button>
            <button onclick="exportData()" class="flex flex-col items-center justify-center bg-emerald-500 text-white border-b-4 border-emerald-800 p-1.5 rounded-xl font-bold text-[9px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>📤</span><span class="whitespace-nowrap">匯出備份</span>
            </button>
            <button onclick="triggerImport()" class="flex flex-col items-center justify-center bg-indigo-500 text-white border-b-4 border-indigo-800 p-1.5 rounded-xl font-bold text-[9px] sm:text-sm active:border-b-0 active:translate-y-1">
                <span>📥</span><span class="whitespace-nowrap">匯入檔案</span>
            </button>
        </div>
        
        <input type="file" id="file-import" class="hidden" accept=".json" onchange="importData(event)">

        <div class="grid grid-cols-2 gap-2 no-print pb-8">
            <button onclick="clearCurrentData()" class="bg-slate-200 text-slate-600 p-1.5 rounded-xl text-[9px] font-bold">清空當前課表</button>
            <button onclick="deleteTrainer()" class="bg-rose-100 text-rose-600 p-1.5 rounded-xl text-[9px] font-bold">刪除此訓練家</button>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-xl transition-all duration-300 z-50 font-bold text-xs text-center min-w-[180px]">
        已同步儲存
    </div>

    <script>
        // 設定資料
        const KNOWN_COURSES = ["國語", "英語", "數學", "生活", "社會", "自然", "藝術", "綜合", "健康", "體育", "彈性", "本土語", "資訊", "音樂", "藝表", "藝美"];
        const COURSES = ["", ...KNOWN_COURSES, "自定義"];

        // 班級前綴清單
        const CLASSES_PREFIX = [""];
        [1, 2, 3, 4, 5, 6].forEach(grade => {
            const count = (grade === 4 || grade === 6) ? 4 : 3;
            for (let i = 1; i <= count; i++) { CLASSES_PREFIX.push(`${grade}-${i}`); }
        });
        CLASSES_PREFIX.push("自定義");

        // 班級模式選單
        const CLASS_MODE_LIST = [{ val: "", text: "-- 班級 --" }];
        [1, 2, 3, 4, 5, 6].forEach(grade => {
            const count = (grade === 4 || grade === 6) ? 4 : 3;
            for (let i = 1; i <= count; i++) { 
                CLASS_MODE_LIST.push({ val: `${grade}-${i}`, text: `${grade}年${i}班` }); 
            }
        });
        CLASS_MODE_LIST.push({ val: "自訂", text: "＋自訂" });

        const DEFAULT_PERIODS = [
            { name: "晨光", time: "08:00~08:25" },
            { name: "第一節", time: "08:30~09:10" },
            { name: "第二節", time: "09:20~10:00" },
            { name: "第三節", time: "10:30~11:10" },
            { name: "第四節", time: "11:20~12:00" },
            { name: "午休", time: "12:00~13:35" },
            { name: "第五節", time: "13:40~14:20" },
            { name: "第六節", time: "14:30~15:10" },
            { name: "第七節", time: "15:20~16:00" }
        ];

        // 讀取本地儲存 (升級儲存標籤確保穩定)
        let appData = JSON.parse(localStorage.getItem('erling_poke_v15')) || {
            trainers: [], 
            currentTrainer: "", 
            defaultTrainer: "",
            schedules: {} 
        };

        window.onload = () => {
            if (appData.defaultTrainer && appData.trainers.includes(appData.defaultTrainer)) {
                appData.currentTrainer = appData.defaultTrainer;
            } else {
                appData.currentTrainer = "";
            }

            renderTimetableSkeleton();
            renderClassModeOptions();
            updateTrainerListUI();
            loadCurrentTrainerData();
        };

        function renderClassModeOptions() {
            const sel = document.getElementById('class-mode-selector');
            sel.innerHTML = '';
            CLASS_MODE_LIST.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.val;
                opt.text = item.text;
                sel.appendChild(opt);
            });
        }

        function renderTimetableSkeleton() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = '';
            DEFAULT_PERIODS.forEach((p, idx) => {
                const tr = document.createElement('tr');
                const tdTime = document.createElement('td');
                tdTime.className = "p-0.5 border-r-2 md:border-r-4 border-b border-slate-800 bg-slate-50 text-center w-[55px] sm:w-[75px]";
                tdTime.innerHTML = `
                    <div id="tn-${idx}" contenteditable="true" class="editable-field font-bold text-slate-800 text-[9px] sm:text-xs" onblur="saveToLocal()">${p.name}</div>
                    <div id="tr-${idx}" contenteditable="true" class="editable-field text-[7px] sm:text-[9px] text-slate-500 font-bold leading-tight whitespace-nowrap" onblur="saveToLocal()">${p.time}</div>
                `;
                tr.appendChild(tdTime);

                for (let d = 1; d <= 5; d++) {
                    const td = document.createElement('td');
                    td.className = "p-0.5 border-b border-r border-slate-200 text-center";
                    const container = document.createElement('div');
                    container.id = `cell-box-${idx}-${d}`;
                    container.className = "merged-cell-container rounded-lg shadow-sm h-10 md:h-16 transition-all";

                    const topRow = document.createElement('div');
                    topRow.className = "h-2/3 flex border-b border-black/5 justify-center items-center";
                    
                    const selPrefix = document.createElement('select');
                    selPrefix.id = `prefix-${idx}-${d}`;
                    selPrefix.className = "prefix-select cursor-pointer";
                    CLASSES_PREFIX.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.text = c || "班級"; selPrefix.appendChild(opt);
                    });
                    selPrefix.onchange = (e) => handleSelectChange(selPrefix, e.target.value, 'prefix', idx, d);

                    const selCourse = document.createElement('select');
                    selCourse.id = `course-${idx}-${d}`;
                    selCourse.className = "course-select-custom cursor-pointer";
                    COURSES.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.text = c || "科目"; selCourse.appendChild(opt);
                    });
                    selCourse.onchange = (e) => handleSelectChange(selCourse, e.target.value, 'course', idx, d);

                    topRow.appendChild(selPrefix);
                    topRow.appendChild(selCourse);

                    const selTeacher = document.createElement('select');
                    selTeacher.id = `teacher-${idx}-${d}`;
                    selTeacher.className = "teacher-select-custom hover:bg-white/40 transition-all text-center";
                    updateTeacherDropdownOptions(selTeacher);
                    selTeacher.onchange = (e) => handleTeacherSelect(selTeacher, e.target.value);

                    container.appendChild(topRow);
                    container.appendChild(selTeacher);
                    td.appendChild(container);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
            document.getElementById('main-title').onblur = () => saveToLocal();
        }

        function updateTeacherDropdownOptions(select) {
            const currentVal = select.value;
            select.innerHTML = '';
            const defOpt = document.createElement('option');
            defOpt.value = ""; defOpt.text = ""; 
            select.appendChild(defOpt);

            appData.trainers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.text = t; select.appendChild(opt);
            });
            const customOpt = document.createElement('option');
            customOpt.value = "自定義"; customOpt.text = "＋自訂"; select.appendChild(customOpt);
            
            if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                select.value = currentVal;
            }
        }

        function handleTeacherSelect(select, value) {
            if (value === "自定義") {
                const custom = prompt("請輸入老師姓名：");
                if (custom) {
                    const opt = document.createElement('option');
                    opt.value = custom; opt.text = custom; 
                    select.insertBefore(opt, select.lastChild);
                    select.value = custom;
                } else { select.value = ""; }
            }
            saveToLocal();
        }

        function handleClassModeChange() {
            const sel = document.getElementById('class-mode-selector');
            if (sel.value === "自訂") {
                const custom = prompt("請輸入自訂班級前綴 (如 3-A):");
                if (custom) {
                    const opt = document.createElement('option');
                    opt.value = custom; opt.text = custom;
                    sel.insertBefore(opt, sel.lastChild);
                    sel.value = custom;
                } else { sel.value = ""; }
            }
            saveToLocal();
        }

        function handleSelectChange(select, value, type, idx, d) {
            if (value === "自定義") {
                const custom = prompt("請輸入自訂名稱：");
                if (custom) {
                    if (!Array.from(select.options).some(o => o.value === custom)) {
                        const opt = document.createElement('option');
                        opt.value = custom; opt.text = custom; select.add(opt);
                    }
                    select.value = custom;
                } else { select.value = ""; }
            }

            if (type === 'course' && value !== "") {
                const classMode = document.getElementById('class-mode-selector').value;
                const classTutor = document.getElementById('class-tutor-input').value;
                const teacherSel = document.getElementById(`teacher-${idx}-${d}`);
                const prefixSel = document.getElementById(`prefix-${idx}-${d}`);

                if (classMode !== "" && classTutor !== "") {
                    if (prefixSel) prefixSel.value = classMode;
                    if (teacherSel) {
                        if (!Array.from(teacherSel.options).some(o => o.value === classTutor)) {
                            const o = document.createElement('option'); o.value = classTutor; o.text = classTutor;
                            teacherSel.insertBefore(o, teacherSel.lastChild);
                        }
                        teacherSel.value = classTutor;
                    }
                } else {
                    if (appData.currentTrainer !== "" && teacherSel && (teacherSel.value === "" || teacherSel.value === "老師")) {
                        teacherSel.value = appData.currentTrainer;
                    }
                }
            } else if (type === 'course' && value === "") {
                const teacherSel = document.getElementById(`teacher-${idx}-${d}`);
                if (teacherSel) teacherSel.value = "";
            }
            
            if (type === 'course') applyTypeStyle(select, idx, d);
            saveToLocal();
        }

        function applyTypeStyle(select, idx, d) {
            const val = select.value;
            const container = document.getElementById(`cell-box-${idx}-${d}`);
            if (!container) return;
            container.classList.forEach(c => { if(c.startsWith('type-')) container.classList.remove(c); });
            if (!val) { container.classList.add('type-none'); select.style.color = "#94a3b8"; return; }
            if (KNOWN_COURSES.includes(val)) { container.classList.add(`type-${val}`); select.style.color = "inherit"; } 
            else { container.classList.add('type-custom'); select.style.color = "white"; }
        }

        function setDefaultTrainer() {
            if (!appData.currentTrainer) { showToast("請先選擇一位訓練家"); return; }
            appData.defaultTrainer = appData.currentTrainer;
            saveToLocal();
            updateTrainerListUI();
            showToast(`已將 ${appData.currentTrainer} 設為預設`);
        }

        function saveToLocal() {
            localStorage.setItem('erling_poke_v15', JSON.stringify(appData));
            if (appData.currentTrainer === "") return;

            const trainer = appData.currentTrainer;
            if (!appData.schedules[trainer]) appData.schedules[trainer] = { prefix: {}, course: {}, teacher: {}, time: {}, title: "", classMode: "", classTutor: "" };

            appData.schedules[trainer].title = document.getElementById('main-title').innerText;
            appData.schedules[trainer].classMode = document.getElementById('class-mode-selector').value;
            appData.schedules[trainer].classTutor = document.getElementById('class-tutor-input').value;

            document.querySelectorAll('select[id^="prefix"]').forEach(s => appData.schedules[trainer].prefix[s.id] = s.value);
            document.querySelectorAll('select[id^="course"]').forEach(s => appData.schedules[trainer].course[s.id] = s.value);
            document.querySelectorAll('select[id^="teacher"]').forEach(s => appData.schedules[trainer].teacher[s.id] = s.value);
            
            const timeData = {};
            DEFAULT_PERIODS.forEach((_, idx) => {
                const tn = document.getElementById(`tn-${idx}`);
                const tr = document.getElementById(`tr-${idx}`);
                if (tn) timeData[`tn-${idx}`] = tn.innerText;
                if (tr) timeData[`tr-${idx}`] = tr.innerText;
            });
            appData.schedules[trainer].time = timeData;

            localStorage.setItem('erling_poke_v15', JSON.stringify(appData));
            showToast("自動同步中");
        }

        function loadCurrentTrainerData() {
            const trainer = appData.currentTrainer;
            if (trainer === "") {
                document.getElementById('main-title').innerText = "二苓國小 114 學年度課表";
                document.getElementById('class-mode-selector').value = "";
                document.getElementById('class-tutor-input').value = "";
                resetTableUI();
                return;
            }

            const data = appData.schedules[trainer];
            document.getElementById('main-title').innerText = (data && data.title) ? data.title : "二苓國小 114 學年度課表";
            
            const cmSel = document.getElementById('class-mode-selector');
            const tutorInp = document.getElementById('class-tutor-input');
            if (data) {
                if (data.classMode) {
                    if (!Array.from(cmSel.options).some(o => o.value === data.classMode)) {
                        const o = document.createElement('option'); o.value = data.classMode; o.text = data.classMode;
                        cmSel.insertBefore(o, cmSel.lastChild);
                    }
                    cmSel.value = data.classMode;
                } else { cmSel.value = ""; }
                tutorInp.value = data.classTutor || "";
            } else {
                cmSel.value = "";
                tutorInp.value = "";
            }

            resetTableUI(); 
            if (!data) return;

            if (data.prefix) {
                Object.entries(data.prefix).forEach(([id, val]) => {
                    const sel = document.getElementById(id);
                    if (sel && val) {
                        if (!Array.from(sel.options).some(o => o.value === val)) {
                            const o = document.createElement('option'); o.value = val; o.text = val; sel.add(o);
                        }
                        sel.value = val;
                    }
                });
            }
            if (data.course) {
                Object.entries(data.course).forEach(([id, val]) => {
                    const sel = document.getElementById(id);
                    if (sel && val) {
                        if (!Array.from(sel.options).some(o => o.value === val)) {
                            const o = document.createElement('option'); o.value = val; o.text = val; sel.add(o);
                        }
                        sel.value = val;
                        applyTypeStyle(sel, id.split('-')[1], id.split('-')[2]);
                    }
                });
            }
            if (data.teacher) {
                Object.entries(data.teacher).forEach(([id, val]) => {
                    const sel = document.getElementById(id);
                    if (sel && val) {
                        if (!Array.from(sel.options).some(o => o.value === val)) {
                            const o = document.createElement('option'); o.value = val; o.text = val; 
                            sel.insertBefore(o, sel.lastChild);
                        }
                        sel.value = val;
                    }
                });
            }
            if (data.time) {
                Object.entries(data.time).forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = val;
                });
            }
        }

        function updateTrainerListUI() {
            const sel = document.getElementById('user-selector');
            sel.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = ""; emptyOpt.text = "-- 選擇 --"; 
            sel.appendChild(emptyOpt);
            appData.trainers.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.text = (t === appData.defaultTrainer) ? `⭐ ${t}` : t; 
                sel.appendChild(opt);
            });
            sel.value = appData.currentTrainer;
        }

        function handleUserSwitch() {
            appData.currentTrainer = document.getElementById('user-selector').value;
            loadCurrentTrainerData();
            if (appData.currentTrainer !== "") { showToast(`切換至: ${appData.currentTrainer}`); }
            saveToLocal();
        }

        function addNewTrainer() {
            const name = prompt("發現新訓練家！請輸入名字：");
            if (name && !appData.trainers.includes(name)) {
                appData.trainers.push(name);
                appData.currentTrainer = name;
                updateTrainerListUI();
                document.querySelectorAll('select[id^="teacher"]').forEach(sel => updateTeacherDropdownOptions(sel));
                loadCurrentTrainerData();
                saveToLocal();
            } else if (name) { alert("該名字已在名冊中！"); }
        }

        function resetTableUI() {
            document.querySelectorAll('select[id^="prefix"], select[id^="course"], select[id^="teacher"]').forEach(s => s.value = "");
            document.querySelectorAll('.merged-cell-container').forEach(c => {
                c.classList.forEach(cl => { if(cl.startsWith('type-')) c.classList.remove(cl); });
                c.classList.add('type-none');
            });
            DEFAULT_PERIODS.forEach((p, idx) => {
                const tn = document.getElementById(`tn-${idx}`);
                const tr = document.getElementById(`tr-${idx}`);
                if (tn) tn.innerText = p.name;
                if (tr) tr.innerText = p.time;
            });
        }

        function clearCurrentData() {
            if (appData.currentTrainer === "") { alert("請先選擇或新增一位訓練家"); return; }
            if (confirm("確定要清空當前課表嗎？")) { resetTableUI(); saveToLocal(); }
        }

        function deleteTrainer() {
            if (appData.currentTrainer === "") return;
            if (confirm(`確定要刪除「${appData.currentTrainer}」嗎？`)) {
                if (appData.currentTrainer === appData.defaultTrainer) appData.defaultTrainer = "";
                delete appData.schedules[appData.currentTrainer];
                appData.trainers = appData.trainers.filter(t => t !== appData.currentTrainer);
                appData.currentTrainer = ""; 
                updateTrainerListUI();
                document.querySelectorAll('select[id^="teacher"]').forEach(sel => updateTeacherDropdownOptions(sel));
                loadCurrentTrainerData();
                saveToLocal();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `二苓課表備份_${new Date().toLocaleDateString()}.json`;
            a.click();
            showToast("備份檔案已下載");
        }

        function triggerImport() { document.getElementById('file-import').click(); }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const content = JSON.parse(e.target.result);
                    if (content.trainers) {
                        appData = content;
                        localStorage.setItem('erling_poke_v15', JSON.stringify(appData));
                        location.reload();
                    }
                } catch (err) { alert("檔案格式錯誤"); }
            };
            reader.readAsText(file);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1000);
        }
    </script>
</body>
</html>
